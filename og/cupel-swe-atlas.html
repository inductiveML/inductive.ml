<!doctype html>
<!-- Source for public/og/cupel-swe-atlas.png. Render at 1200×630 with headless Chrome (see og/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="card.css" rel="stylesheet" />
<style>
  h1 { font-size: 96px; }
  .line { line-height: 1.5; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">Inductive ML</span>
    <span class="kicker">Cupel audit · SWE Atlas (Scale AI)</span>
  </div>
  <div class="rule"></div>
  <div class="main">
    <div>
      <h1>Six grader<br />findings,<br /><span class="accent">one Critical</span></h1>
      <p class="sub">Credited by Scale in <em>SWE Atlas v1.1.</em></p>
    </div>
    <div class="side">
      <div class="card">
        <div class="lbl">// findings</div>
        <div class="line"><span>E</span><span class="v accent">Critical</span></div>
        <div class="line"><span>F</span><span class="v">High</span></div>
        <div class="line"><span>B</span><span class="v">High</span></div>
        <div class="line"><span>A</span><span class="v">Medium</span></div>
        <div class="line"><span>D</span><span class="v">Medium-low</span></div>
        <div class="line"><span>C</span><span class="v">Low-medium</span></div>
      </div>
      <div class="cta"><span>Read the audit</span><span class="url">inductive.ml →</span></div>
    </div>
  </div>
  <div class="band" aria-hidden="true">
    <div class="solid"></div>
    <div class="dots" style="--r:4.8px;--r2:5.3px"></div>
    <div class="dots" style="--r:3.9px;--r2:4.4px"></div>
    <div class="dots" style="--r:3.2px;--r2:3.7px"></div>
    <div class="dots" style="--r:2.6px;--r2:3.1px"></div>
    <div class="dots" style="--r:2.1px;--r2:2.6px"></div>
    <div class="dots" style="--r:1.6px;--r2:2.1px"></div>
    <div class="dots" style="--r:1.1px;--r2:1.6px"></div>
    <div class="dots" style="--r:0.6px;--r2:1.1px"></div>
    <div></div>
  </div>
</body>
</html>
