<!doctype html>
<!-- Source for public/og/cupel-mimo.png. Render at 1200×630 with headless Chrome (see og/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="card.css" rel="stylesheet" />
<style>
  h1 { font-size: 68px; line-height: 0.98; }
  h1 + h1 { margin-top: 24px; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">Inductive ML</span>
    <span class="kicker">Cupel audit · Severity Low</span>
  </div>
  <div class="rule"></div>
  <div class="main">
    <div>
      <h1>The git-history<br />fix holds.</h1>
      <h1>A file-timestamp leak<br />remains in <span class="accent">85.3%</span><br />of tasks.</h1>
    </div>
    <div class="side">
      <div class="card">
        <div class="lbl">// MiMo-V2.6-RL-oss</div>
        <div class="line"><span>git-history leak</span><span class="v">0/300</span></div>
        <div class="line"><span>timestamp leak</span><span class="v accent">85.3%</span></div>
        <div class="line"><span>severity</span><span class="v">Low</span></div>
      </div>
      <div class="cta"><span>Read the audit</span><span class="url">inductive.ml →</span></div>
    </div>
  </div>
  <div class="band" aria-hidden="true">
    <div class="solid"></div>
    <div class="dots" style="--r:4.8px;--r2:5.3px"></div>
    <div class="dots" style="--r:3.9px;--r2:4.4px"></div>
    <div class="dots" style="--r:3.2px;--r2:3.7px"></div>
    <div class="dots" style="--r:2.6px;--r2:3.1px"></div>
    <div class="dots" style="--r:2.1px;--r2:2.6px"></div>
    <div class="dots" style="--r:1.6px;--r2:2.1px"></div>
    <div class="dots" style="--r:1.1px;--r2:1.6px"></div>
    <div class="dots" style="--r:0.6px;--r2:1.1px"></div>
    <div></div>
  </div>
</body>
</html>
