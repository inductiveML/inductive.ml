<!doctype html>
<!-- Source for public/og/cupel.png. Render at 1200×630 with headless Chrome (see og/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="card.css" rel="stylesheet" />
<style>
  h1 { font-size: 168px; line-height: 0.86; letter-spacing: -0.045em; }
  .sub { margin-top: 34px; font-size: 40px; line-height: 1.15; }
  .line { line-height: 1.5; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">Inductive ML</span>
    <span class="kicker">RL environment audits</span>
  </div>
  <div class="rule"></div>
  <div class="main">
    <div>
      <h1>Cupel</h1>
      <p class="sub">Independent audits<br />of RL environments.<br /><em>Acknowledged by Scale AI.</em></p>
    </div>
    <div class="side">
      <div class="card">
        <div class="lbl">// what an audit checks</div>
        <div class="line"><span>Answer leakage</span><span class="v accent">●</span></div>
        <div class="line"><span>Grader tampering</span><span class="v accent">●</span></div>
        <div class="line"><span>Sandbox egress</span><span class="v accent">●</span></div>
        <div class="line"><span>Impossible tasks</span><span class="v accent">●</span></div>
        <div class="line"><span>Solvability</span><span class="v accent">●</span></div>
        <div class="line"><span>Pass-rate band</span><span class="v accent">●</span></div>
      </div>
      <div class="cta"><span>Read the audits</span><span class="url">inductive.ml →</span></div>
    </div>
  </div>
  <div class="band" aria-hidden="true">
    <div class="solid"></div>
    <div class="dots" style="--r:4.8px;--r2:5.3px"></div>
    <div class="dots" style="--r:3.9px;--r2:4.4px"></div>
    <div class="dots" style="--r:3.2px;--r2:3.7px"></div>
    <div class="dots" style="--r:2.6px;--r2:3.1px"></div>
    <div class="dots" style="--r:2.1px;--r2:2.6px"></div>
    <div class="dots" style="--r:1.6px;--r2:2.1px"></div>
    <div class="dots" style="--r:1.1px;--r2:1.6px"></div>
    <div class="dots" style="--r:0.6px;--r2:1.1px"></div>
    <div></div>
  </div>
</body>
</html>
