<!doctype html>
<!-- Source for public/og/cupel-mimo-grader.png. Render at 1200×630 with headless Chrome (see og/README.md). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="card.css" rel="stylesheet" />
<style>
  h1 { font-size: 54px; line-height: 1.02; letter-spacing: -0.03em; }
  h1 .figure { display: block; font-size: 168px; line-height: 0.86; letter-spacing: -0.045em; color: var(--crimson); margin: 0 0 18px -6px; }
  .line { font-size: 22px; }
  .stamp { border: 5px solid var(--crimson); color: var(--crimson); font-size: 104px; font-weight: 800; font-stretch: 86%; line-height: 1; letter-spacing: 0.02em; text-align: center; padding: 10px 0 12px; margin-bottom: 14px; }
</style>
</head>
<body>
  <div class="top">
    <span class="brand">Inductive ML</span>
    <span class="kicker">Cupel audit · High · <strong>FAIL</strong></span>
  </div>
  <div class="rule"></div>
  <div class="main">
    <div>
      <h1><span class="figure">50.8%</span> of MiMo-V2.6-RL-oss<br />environments pass<br />without solving the task</h1>
    </div>
    <div class="side">
      <div class="card">
        <div class="lbl">// cupel stamp</div>
        <div class="stamp">FAIL</div>
        <div class="line"><span>severity</span><span class="v accent">High</span></div>
        <div class="line"><span>forced PASS</span><span class="v">1,322/2,601</span></div>
      </div>
      <div class="cta"><span>Read the audit</span><span class="url">inductive.ml →</span></div>
    </div>
  </div>
  <div class="band" aria-hidden="true">
    <div class="solid"></div>
    <div class="dots" style="--r:4.8px;--r2:5.3px"></div>
    <div class="dots" style="--r:3.9px;--r2:4.4px"></div>
    <div class="dots" style="--r:3.2px;--r2:3.7px"></div>
    <div class="dots" style="--r:2.6px;--r2:3.1px"></div>
    <div class="dots" style="--r:2.1px;--r2:2.6px"></div>
    <div class="dots" style="--r:1.6px;--r2:2.1px"></div>
    <div class="dots" style="--r:1.1px;--r2:1.6px"></div>
    <div class="dots" style="--r:0.6px;--r2:1.1px"></div>
    <div></div>
  </div>
</body>
</html>
